server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API ядра — прокси на core-server (имя сервиса из docker-compose)
  location /api/ {
    proxy_pass http://core-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # заголовок ротации токена должен дойти до браузера
    add_header Access-Control-Expose-Headers "X-Rotated-Refresh-Token" always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
